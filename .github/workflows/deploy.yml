name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply requested portfolio text update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = '''              <div className="timeline-date">Mar & Nov 2023</div>
              <div>
                <h3>Visiting Researcher</h3>
                <p className="timeline-org">
                  Shanghai Jiao Tong University ·{" "}
                  <a
                    className="supervisor-link"
                    href="https://en.smse.sjtu.edu.cn/about/overview"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SMSE
                  </a>
                  {" & "}
                  <a
                    className="supervisor-link"
                    href="https://www.sustech.edu.cn/en/"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SUSTech
                  </a>{" "}
                  · Department of Mechanical and Energy Engineering
                </p>
              </div>'''
          new = '''              <div className="timeline-date">Apr - Nov 2023</div>
              <div>
                <h3>Visiting Researcher</h3>
                <p className="timeline-org">
                  <a
                    className="supervisor-link"
                    href="https://www.sustech.edu.cn/en/"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SUSTech
                  </a>{" "}
                  · Department of Mechanical and Energy Engineering & Shanghai Jiao Tong University ·{" "}
                  <a
                    className="supervisor-link"
                    href="https://en.smse.sjtu.edu.cn/about/overview"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SMSE
                  </a>
                </p>
              </div>'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
