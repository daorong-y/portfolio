name: One-time portfolio text update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visiting researcher entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = '''              <div className="timeline-date">Mar & Nov 2023</div>
              <div>
                <h3>Visiting Researcher</h3>
                <p className="timeline-org">
                  Shanghai Jiao Tong University ·{" "}
                  <a
                    className="supervisor-link"
                    href="https://en.smse.sjtu.edu.cn/about/overview"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SMSE
                  </a>
                  {" & "}
                  <a
                    className="supervisor-link"
                    href="https://www.sustech.edu.cn/en/"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SUSTech
                  </a>{" "}
                  · Department of Mechanical and Energy Engineering
                </p>
              </div>'''
          new = '''              <div className="timeline-date">Apr - Nov 2023</div>
              <div>
                <h3>Visiting Researcher</h3>
                <p className="timeline-org">
                  <a
                    className="supervisor-link"
                    href="https://www.sustech.edu.cn/en/"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SUSTech
                  </a>{" "}
                  · Department of Mechanical and Energy Engineering & Shanghai Jiao Tong University ·{" "}
                  <a
                    className="supervisor-link"
                    href="https://en.smse.sjtu.edu.cn/about/overview"
                    target="_blank"
                    rel="noreferrer"
                  >
                    SMSE
                  </a>
                </p>
              </div>'''
          if old not in text:
              raise SystemExit('Expected visiting researcher block was not found; no changes made.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Update visiting researcher dates and affiliation" || exit 0
          rm .github/workflows/update-visiting-researcher.yml
          git add .github/workflows/update-visiting-researcher.yml
          git commit -m "Remove one-time portfolio update workflow"
          git push
